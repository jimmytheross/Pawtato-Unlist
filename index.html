<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Pawtato Land #15685 — Unlist</title>
</head>

<body>

<h1>Unlist Pawtato Land #15685</h1>

<p>
This page is specifically for the Sui version of Nightly.
</p>

<button id="connect">Connect Nightly Sui</button>
<button id="unlist" disabled>Unlist NFT</button>

<pre id="status">Waiting for Nightly Sui...</pre>

<script type="module">

import { Transaction } from
"https://esm.sh/@mysten/sui@latest/transactions";

const PACKAGE =
"0xe50387176587c707c428c537b7b8fb530c3eaeadd16a45b1d975369f372dbc0a";

const LAND =
"0x9afb9a1c63a9bbaba650ef0a6b473b9874882cd63aab9570b99274e8f796f00::pawtato::LAND";

const REGISTRY =
"0x6c2f62f0ca9b2d2ae09b6fc53defff6e35a66b8c5412d00b8d3ff435a5ab7693";

const KIOSK =
"0x7646f619693397d4dfbd7e7d21e772c1005bf33b0c7c00bdf4947aad9184d2fe";

const KIOSK_OWNER_CAP =
"0xeb821e4c0ecc62c2ee530d27dea987aab7741664c8072a784b672573fb4b82b7";

const NFT =
"0x63118f4a0de3dc92a5cde98647e8cfd1c31492734a18b9ffb27dc51e3ff88cfa";

const status = document.getElementById("status");
const connectButton = document.getElementById("connect");
const unlistButton = document.getElementById("unlist");

let suiWallet = null;
let account = null;

function show(message) {
    status.textContent = message;
}


/*
  NIGHTLY SUI

  Nightly exposes its Sui wallet separately from
  its Solana wallet.
*/

function getSuiWallet() {

    if (
        window.nightly &&
        window.nightly.sui
    ) {
        return window.nightly.sui;
    }

    return null;
}


connectButton.onclick = async function() {

    try {

        suiWallet = getSuiWallet();

        if (!suiWallet) {

            throw new Error(
                "Nightly Sui wallet was not detected. " +
                "Make sure the Nightly extension is installed, " +
                "unlocked, and that this page is being opened from GitHub Pages."
            );

        }

        show(
            "Nightly Sui detected.\n\n" +
            "Requesting Sui connection..."
        );


        /*
          Nightly's Sui connection
        */

        if (suiWallet.connect) {

            const result =
                await suiWallet.connect();

            account =
                result?.accounts?.[0] ||
                result?.account ||
                result;

        }

        else if (suiWallet.request) {

            const result =
                await suiWallet.request({
                    method: "sui_connect"
                });

            account =
                result?.accounts?.[0] ||
                result?.account ||
                result;

        }

        else {

            throw new Error(
                "Nightly Sui wallet was found, but its connection method was not available."
            );

        }


        if (!account) {

            throw new Error(
                "Nightly did not return a Sui account."
            );

        }


        const address =
            account.address ||
            account.publicKey ||
            account;

        show(
            "Connected to Sui:\n\n" +
            address
        );

        unlistButton.disabled = false;

    }

    catch(error) {

        show(
            "Sui connection error:\n\n" +
            error.message
        );

    }

};


unlistButton.onclick = async function() {

    try {

        if (!suiWallet || !account) {

            throw new Error(
                "Connect the Nightly Sui wallet first."
            );

        }


        const address =
            account.address ||
            account.publicKey;


        /*
          Construct the transaction.
        */

        const tx =
            new Transaction();

        tx.setSender(address);


        tx.moveCall({

            target:
                `${PACKAGE}::marketplace::delist`,

            typeArguments: [
                LAND
            ],

            arguments: [

                tx.sharedObjectRef({

                    objectId:
                        REGISTRY,

                    initialSharedVersion:
                        "850697169",

                    mutable:
                        true

                }),

                tx.sharedObjectRef({

                    objectId:
                        KIOSK,

                    initialSharedVersion:
                        "856595132",

                    mutable:
                        true

                }),

                tx.object(
                    KIOSK_OWNER_CAP
                ),

                tx.pure.address(
                    NFT
                )

            ]

        });


        show(
            "Opening Nightly Sui...\n\n" +
            "STOP and review the transaction before approving it."
        );


        /*
          Ask Nightly Sui to sign and execute.
        */

        if (
            suiWallet.signAndExecuteTransaction
        ) {

            const result =
                await suiWallet.signAndExecuteTransaction({

                    transaction:
                        tx,

                    account:
                        account,

                    chain:
                        "sui:mainnet"

                });


            show(
                "Transaction submitted:\n\n" +
                JSON.stringify(
                    result,
                    null,
                    2
                )
            );

        }

        else {

            throw new Error(
                "Nightly Sui signing method was not available."
            );

        }

    }

    catch(error) {

        show(
            "Transaction error:\n\n" +
            error.message
        );

    }

};

</script>

</body>
</html>
